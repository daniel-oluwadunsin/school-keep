[project]
name = "school-keep-research"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3",
  "pillow>=11,<13",
  "pypdfium2>=4.30,<6",
  "numpy>=1.26,<3",
  "faiss-cpu>=1.9,<2",
  "sentence-transformers>=3.4,<7",
  "colpali-engine>=0.3.9,<1",
  "transformers>=4.48,<6",
  "torch>=2.5,<3",
  "paddleocr>=3,<4",
  "paddlepaddle>=3,<4",
  "streamlit>=1.42,<2",
  "pandas>=2.2,<3",
  "scikit-learn>=1.6,<2",
  "requests>=2.32,<3",
  "datasets>=3,<5",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["research", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
